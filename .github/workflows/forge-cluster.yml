name: Forge cluster round (DiLoCo)

# One DiLoCo round of the forge cluster (cluster/fabric.py, docs/CLUSTER.md):
# prepare (build forge, load or create the global model) -> W workers in parallel
# (each downloads its own share of the pinned public corpus and trains H steps)
# -> aggregate (outer Nesterov step, eval, new state artifact).
#
# runner ubuntu-latest: GitHub-hosted, a bounded test of the cluster software
#   (at most 4 workers, 200 steps, no chaining) -- GitHub's terms do not allow a
#   training farm on hosted runners.
# runner forge: the owner's self-hosted runners (label "forge"); this is where the
#   cluster trains. With continue=true every round dispatches the next one, so the
#   cluster runs without any session; `rounds` bounds it.
#
# The workflow file lives on main (workflow_dispatch needs the default branch); the
# code it runs is checked out from `ref`.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: ubuntu-latest (test) or forge (self-hosted training)
        type: choice
        options: [ubuntu-latest, forge]
        default: ubuntu-latest
      ref:
        description: Branch or commit with the cluster code
        type: string
        default: claude/gitops-multi-model-finetuning-ort4m9
      workers:
        description: Workers per round (1-16)
        type: string
        default: "4"
      steps:
        description: Inner steps per worker (H)
        type: string
        default: "100"
      from_run:
        description: Run id whose cluster-state to continue (empty = new model from scratch)
        type: string
        default: ""
      model:
        description: Run config with the model shape (new models only)
        type: string
        default: base-s.json
      shard_tokens:
        description: Tokens per worker shard
        type: string
        default: "20e6"
      rounds:
        description: Rounds left including this one (chaining, forge runner only)
        type: string
        default: "1"
      continue:
        description: Dispatch the next round when this one succeeds (forge runner only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forge-cluster
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - name: Validate inputs
        id: plan
        env:
          RUNNER: ${{ inputs.runner }}
          REF: ${{ inputs.ref }}
          W: ${{ inputs.workers }}
          H: ${{ inputs.steps }}
          FROM: ${{ inputs.from_run }}
          MODEL: ${{ inputs.model }}
          TOK: ${{ inputs.shard_tokens }}
          ROUNDS: ${{ inputs.rounds }}
          CONT: ${{ inputs.continue }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || { echo "bad ref"; exit 1; }
          [[ "$W" =~ ^[0-9]{1,2}$ ]] && (( W >= 1 && W <= 16 )) || { echo "workers must be 1-16"; exit 1; }
          [[ "$H" =~ ^[0-9]{1,5}$ ]] && (( H >= 1 )) || { echo "bad steps"; exit 1; }
          [[ -z "$FROM" || "$FROM" =~ ^[0-9]{1,20}$ ]] || { echo "bad from_run"; exit 1; }
          [[ "$MODEL" =~ ^[a-z0-9._-]+\.json$ ]] || { echo "bad model"; exit 1; }
          [[ "$TOK" =~ ^[0-9.]+(e[0-9]+)?$ ]] || { echo "bad shard_tokens"; exit 1; }
          [[ "$ROUNDS" =~ ^[0-9]{1,5}$ ]] && (( ROUNDS >= 1 )) || { echo "bad rounds"; exit 1; }
          if [ "$RUNNER" = ubuntu-latest ]; then
            (( W <= 4 && H <= 200 )) || { echo "hosted runners: a bounded test only (workers <= 4, steps <= 200)"; exit 1; }
            [ "$CONT" != true ] || { echo "hosted runners: no chaining"; exit 1; }
          fi
          echo "workers=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$W")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.runner == 'ubuntu-latest'
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet numpy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p forge
      - name: Load the global model (or create one from scratch)
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: cluster-state
          path: state
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
      - name: New model from scratch
        if: inputs.from_run == ''
        env:
          MODEL: ${{ inputs.model }}
          SEED: ${{ github.run_id }}
        run: python3 cluster/fabric.py init --scratch "training/configs/$MODEL" --state state --seed "$((SEED % 1000000007))"
      - run: cat state/round.json
      - uses: actions/upload-artifact@v4
        with:
          name: round-input
          path: |
            target/release/forge
            state/
          retention-days: 2

  work:
    needs: prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.prepare.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.runner == 'ubuntu-latest'
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          name: round-input
          path: .
      - run: chmod +x target/release/forge
      - name: Data shard (cached per shard)
        id: shard
        uses: actions/cache@v4
        with:
          path: shard
          key: shard-v1-${{ hashFiles('data/manifests/v3/sources.json', 'cluster/shard.py', 'data/hq_filter.py', 'data/tokenizer.json') }}-${{ matrix.worker }}-of-${{ inputs.workers }}-${{ inputs.shard_tokens }}
      - name: Build the shard from the pinned public packages
        if: steps.shard.outputs.cache-hit != 'true'
        env:
          W: ${{ inputs.workers }}
          I: ${{ matrix.worker }}
          TOK: ${{ inputs.shard_tokens }}
        run: python3 cluster/shard.py --shard "$I" --of "$W" --out shard --max-tokens "$TOK"
      - name: Train H steps
        env:
          I: ${{ matrix.worker }}
          H: ${{ inputs.steps }}
        run: python3 cluster/fabric.py work --state state --worker "$I" --steps "$H" --data shard/train.meta.json --out "delta-$I"
      - uses: actions/upload-artifact@v4
        with:
          name: delta-${{ matrix.worker }}
          path: delta-${{ matrix.worker }}/
          retention-days: 2

  aggregate:
    needs: [prepare, work]
    if: always() && needs.prepare.result == 'success'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.runner == 'ubuntu-latest'
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          name: round-input
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: delta-*
          path: deltas
      - run: chmod +x target/release/forge
      - name: Outer step (Nesterov, quorum 50 %)
        env:
          W: ${{ inputs.workers }}
        run: python3 cluster/fabric.py aggregate --state state --deltas deltas/* --expected "$W" --quorum 0.5
      - name: Validation data (shard 0)
        id: val
        uses: actions/cache/restore@v4
        with:
          path: shard
          key: shard-v1-${{ hashFiles('data/manifests/v3/sources.json', 'cluster/shard.py', 'data/hq_filter.py', 'data/tokenizer.json') }}-0-of-${{ inputs.workers }}-${{ inputs.shard_tokens }}
      - name: Eval
        if: steps.val.outputs.cache-hit == 'true'
        run: python3 cluster/fabric.py eval --state state --data shard/train.meta.json --batches 16
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-state
          path: state/
          retention-days: 90
      - name: Summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("state/round.json"))
          h = r["history"][-1]
          print(f"### Forge cluster round {h['round']} -> {r['round']}\n")
          print("| workers | tokens | slowest worker s | cluster tok/s | worker loss | val loss |\n|---|---|---|---|---|---|")
          print(f"| {h['workers']} | {h['tokens']:,} | {h['seconds']:.0f} | {h['tokens_per_s']:.0f} | {h['loss_last']:.3f} | {h.get('val_loss', 'n/a')} |")
          print(f"\nfrom: {r['from']}; global sha256 `{r['global_sha256'][:16]}`")
          EOF
      - name: Next round
        if: inputs.continue && inputs.runner == 'forge' && inputs.rounds != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          REF: ${{ inputs.ref }}
          W: ${{ inputs.workers }}
          H: ${{ inputs.steps }}
          TOK: ${{ inputs.shard_tokens }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          gh workflow run forge-cluster.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f runner=forge -f ref="$REF" -f workers="$W" -f steps="$H" -f from_run="$RUN" \
            -f shard_tokens="$TOK" -f rounds="$((ROUNDS - 1))" -f continue=true
