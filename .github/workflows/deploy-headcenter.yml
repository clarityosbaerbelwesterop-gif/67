name: Headcenter

# Tests the iPad mission control (backend, agents, control channel, API) on
# every change and smoke-runs it against a real training run. The static
# pages (headcenter UI + WebGPU runtime) can be published to GitHub Pages on
# demand; the UI then connects to a headcenter given as #api=wss://host.

on:
  pull_request:
    paths: ["headcenter/**", "webgpu/**", "scripts/train_all.sh", ".github/workflows/deploy-headcenter.yml"]
  push:
    branches: [main]
    paths: ["headcenter/**", "webgpu/**"]
  workflow_dispatch:
    inputs:
      pages:
        description: "Publish the static pages to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r headcenter/requirements.txt
      - name: Unit and API tests
        run: python -m pytest -q -p no:warnings headcenter/tests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p forge
      - name: Smoke - live run under the headcenter
        run: |
          set -euo pipefail
          mkdir -p runs && mkfifo runs/smoke.ctl
          ./target/release/forge train --config training/configs/smoke.json <>runs/smoke.ctl > runs/smoke.jsonl &
          TRAIN=$!
          python -m headcenter.backend --runs runs --token ci --port 8067 &
          for i in $(seq 30); do curl -sf localhost:8067/api/health && break; sleep 1; done
          curl -sf -H "Authorization: Bearer ci" localhost:8067/api/runs | python -c "import json,sys; r=json.load(sys.stdin)['runs']; assert 'smoke' in r, r; print(r['smoke']['status'], r['smoke']['step'])"
          curl -sf localhost:8067/ | grep "forge headcenter" > /dev/null
          curl -sf localhost:8067/webgpu/ | grep "WebGPU" > /dev/null
          wait $TRAIN

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p site/webgpu
          cp headcenter/frontend/index.html site/index.html
          cp webgpu/index.html webgpu/forge-webgpu.mjs site/webgpu/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
